name: "Pull Request"
description: Runs rules against PRs
inputs:
  ADMIN_PAT:
    description: Deprecated and ignored. The title lint uses the workflow's own GITHUB_TOKEN (needs pull-requests read).
    required: false
runs:
  using: composite
  steps:
    - name: PR Title Lint
      if: github.event.pull_request.state == 'open'
      uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ github.token }}
